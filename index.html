<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Your File</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .download-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            font-size: 4rem;
            color: #4a90e2;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }

        p {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-block;
            background-color: #4a90e2;
            color: #ffffff;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(74, 144, 226, 0.2);
        }

        .download-btn:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .file-info {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #bdc3c7;
        }
    </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8886208647854450"
     crossorigin="anonymous"></script>
</head>
<body>

    <div class="download-card">
        <div class="icon">💾</div>
        <h1>Your File is Ready</h1>
        <p>Click the button below to instantly download your requested resource to your device.</p>
        
        
        <a href="exitlag.zip" download="DownloadedFile" class="download-btn">
            Download File
        </a>

        <div class="file-info">
            Format: ZIP | Safe & Secure
        </div>
    </div>

</body>
</html>
